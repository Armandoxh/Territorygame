<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111418">
<title>Territory</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111418;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: 0.5px; }
  p  { opacity: 0.7; margin: 4px 0; font-size: 14px; }
  code {
    background: #1c2128;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="stage">
    <h1>Territory</h1>
    <p>Hosting check.</p>
    <p>If you can read this on your phone, GitHub Pages is live.</p>
    <p style="margin-top:24px"><code id="ts"></code></p>
  </div>
<script>
  document.getElementById('ts').textContent = 'Build ' + new Date().toISOString();
</script>
</body>
</html>

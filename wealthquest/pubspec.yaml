name: wealthquest
description: "A mobile life-sim / stock-market game. Start at 18 with a day job; each Next Month advances a month — watch your investments perform."
publish_to: "none"
version: 0.45.0+112

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Metro Magnate v2</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a1120;
        font-family:
          Inter,
          -apple-system,
          'Helvetica Neue',
          Arial,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      .chip {
        position: fixed;
        color: #fff;
        background: rgba(16, 18, 24, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        pointer-events: none;
        z-index: 2;
      }
      #title {
        top: calc(10px + env(safe-area-inset-top));
        left: 10px;
      }
      #cash {
        top: calc(10px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        font-size: 15px;
        letter-spacing: 0.06em;
      }
      #rate {
        top: calc(42px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        font-weight: 600;
        font-size: 10px;
        letter-spacing: 0.06em;
        border-top: none;
        padding: 3px 8px;
      }
      #build {
        top: calc(10px + env(safe-area-inset-top));
        right: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      #phase {
        bottom: calc(12px + env(safe-area-inset-bottom));
        right: 10px;
        color: #ffd98a;
      }
      #btn-lines {
        position: fixed;
        bottom: calc(12px + env(safe-area-inset-bottom));
        left: 10px;
        z-index: 3;
        background: #14161c;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 10px 16px;
        font: 800 12px Inter, sans-serif;
        letter-spacing: 0.14em;
      }
      #panel {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(58px + env(safe-area-inset-bottom));
        max-height: 46vh;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #1a1a1a;
        z-index: 3;
        color: #1a1a1a;
      }
      .panel-head {
        position: sticky;
        top: 0;
        background: #1a1a1a;
        color: #fff;
        padding: 8px 10px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-bottom: 1px solid #dedede;
        font-size: 12px;
      }
      .row .nm {
        font-weight: 800;
        flex: 0 0 auto;
      }
      .row .meta {
        color: #666;
        flex: 1;
        font-size: 11px;
      }
      .row.locked .nm {
        color: #888;
      }
      .row button {
        background: #fff;
        border: 1px solid #1a1a1a;
        color: #1a1a1a;
        font: 800 10.5px Inter, sans-serif;
        letter-spacing: 0.08em;
        padding: 6px 9px;
        white-space: nowrap;
      }
      .row button:disabled {
        border-color: #bbb;
        color: #aaa;
      }
      .bullet {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        color: #fff;
        font-size: 10px;
        font-weight: 900;
        flex: 0 0 auto;
      }
      #station-card {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(58px + env(safe-area-inset-bottom));
        min-width: 240px;
        max-width: 92vw;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #1a1a1a;
        color: #1a1a1a;
        z-index: 3;
        font-size: 12px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-bottom: 1px solid #dedede;
      }
      .card-head .x {
        margin-left: auto;
        background: none;
        border: none;
        font-size: 16px;
        line-height: 1;
        color: #1a1a1a;
      }
      .card-row {
        padding: 7px 10px;
        color: #444;
      }
      #toasts {
        position: fixed;
        top: calc(72px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }
      .toast {
        background: #1a1a1a;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        animation: toastfade 5.2s forwards;
      }
      @keyframes toastfade {
        0% { opacity: 0; transform: translateY(-6px); }
        6% { opacity: 1; transform: none; }
        85% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div class="chip" id="title">METRO MAGNATE · V2</div>
    <div class="chip" id="cash"></div>
    <div class="chip" id="rate"></div>
    <div class="chip" id="build"></div>
    <div class="chip" id="phase"></div>
    <button id="btn-lines">LINES</button>
    <div id="panel" hidden></div>
    <div id="station-card" hidden></div>
    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

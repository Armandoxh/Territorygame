<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Metro Magnate v2</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a1120;
        font-family:
          Inter,
          -apple-system,
          'Helvetica Neue',
          Arial,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        /* iOS ignores user-scalable=no; this is what actually stops
           double-tap page zoom while keeping panel scrolling alive. */
        touch-action: manipulation;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      .chip {
        position: fixed;
        color: #fff;
        background: rgba(16, 18, 24, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        pointer-events: none;
        z-index: 2;
      }
      #topbar {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: 10px;
        right: 10px;
        display: flex;
        gap: 6px;
        z-index: 2;
      }
      #topbar .chip {
        position: static;
      }
      #cash {
        flex: 1;
        text-align: center;
        font-size: 14px;
        letter-spacing: 0.06em;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
      }
      .cashrate {
        font-size: 10px;
        font-weight: 700;
        color: #8fd18f;
        letter-spacing: 0.04em;
      }
      #rate {
        top: calc(46px + env(safe-area-inset-top));
        right: 10px;
        font-weight: 600;
        font-size: 10px;
        letter-spacing: 0.06em;
        padding: 3px 8px;
      }

      #phase {
        bottom: calc(12px + env(safe-area-inset-bottom));
        right: 10px;
        color: #fff;
        font-weight: 700;
        border: none;
        background: rgba(16, 18, 24, 0.75);
      }
      #phase::before {
        content: '●';
        color: #ffd98a;
        margin-right: 5px;
        font-size: 8px;
        vertical-align: 1px;
      }
      #deskbar {
        position: fixed;
        bottom: calc(12px + env(safe-area-inset-bottom));
        left: 10px;
        z-index: 3;
        display: flex;
        gap: 6px;
      }
      .deskbtn {
        position: relative;
        background: #1a1a1a;
        color: #fff;
        border: none;
        padding: 13px 14px;
        font: 800 11px Inter, sans-serif;
        letter-spacing: 0.12em;
      }
      .deskbtn.dot::after {
        content: '';
        position: absolute;
        top: 4px;
        right: 4px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #e5484d;
      }
      #goal-strip {
        top: calc(46px + env(safe-area-inset-top));
        left: 10px;
        right: 96px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 0.04em;
        pointer-events: auto;
        cursor: pointer;
      }
      #goal-strip span:first-child {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gsbar {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.22);
        min-width: 40px;
      }
      .gsfill {
        display: block;
        height: 100%;
      }
      .multrow {
        display: flex;
        gap: 6px;
        padding: 8px 12px;
        border-bottom: 1px solid #ececec;
        flex-wrap: wrap;
      }
      .multchip {
        font-size: 10px;
        font-weight: 800;
        border: 1px solid currentColor;
        padding: 3px 7px;
      }
      .grow {
        padding: 8px 12px 2px;
      }
      .growline {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .gname {
        font-size: 12px;
        font-weight: 800;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .greward {
        font-size: 11px;
        font-weight: 800;
      }
      .growbar {
        height: 5px;
        background: #eaeaea;
        margin-top: 5px;
      }
      .gfill {
        height: 100%;
        background: var(--tk, #1a1a1a);
      }
      .gfrac {
        font-size: 9.5px;
        font-weight: 700;
        color: #9a9a9a;
        padding: 3px 0 6px;
        font-variant-numeric: tabular-nums;
      }
      .gnext {
        padding: 0 12px 8px;
        font-size: 10px;
        font-weight: 700;
        color: #b5b5b5;
        border-bottom: 1px solid #ececec;
      }
      .buildfoot {
        padding: 10px 12px 12px;
        text-align: center;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #c0c0c0;
      }
      .chipbtn {
        pointer-events: auto;
        cursor: pointer;
        top: calc(74px + env(safe-area-inset-top));
        right: 10px;
        background: #14161c;
      }
      .pbar {
        height: 5px;
        background: #e4e4e4;
        margin: 0 10px 8px;
      }
      .pfill {
        height: 100%;
        background: #1a1a1a;
      }
      .rushnow {
        color: #c62828;
        font-weight: 800;
      }
      .row .mark {
        width: 14px;
        font-weight: 900;
        color: #1a1a1a;
      }
      .row.goal-done .nm {
        color: #888;
        font-weight: 700;
      }
      .row.goal-ahead .nm,
      .row.goal-ahead .mark {
        color: #b5b5b5;
      }
      .row.goal-current {
        background: #f6f2e4;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .panel-head > span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .head-right {
        flex: 0 0 auto;
      }
      .head-bal {
        font-weight: 600;
      }
      .head-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modebtn {
        background: #fff;
        color: #1a1a1a;
        border: none;
        font: 800 10px Inter, sans-serif;
        letter-spacing: 0.08em;
        padding: 4px 8px;
      }
      .xbtn {
        background: none;
        border: none;
        color: inherit;
        font-size: 19px;
        line-height: 1;
        padding: 8px 12px;
        margin: -8px -8px -8px 0;
        cursor: pointer;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid #1a1a1a;
      }
      .tabs button {
        flex: 1;
        background: #f1f1f1;
        border: none;
        border-right: 1px solid #dedede;
        color: #888;
        font: 800 10.5px Inter, sans-serif;
        letter-spacing: 0.1em;
        padding: 13px 6px;
      }
      .tabs button:first-child {
        flex: 0 0 52px;
        font-size: 16px;
        color: #1a1a1a;
      }
      .tabs button.on {
        background: #fff;
        color: #1a1a1a;
        box-shadow: inset 0 -3px 0 var(--line, #1a1a1a);
      }
      .sect {
        background: #f4f4f4;
        color: #777;
        padding: 6px 12px;
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.1em;
        border-bottom: 1px solid #e6e6e6;
      }
      .row .chev {
        color: #999;
        font-size: 16px;
        font-weight: 800;
      }
      .row .pri {
        padding: 4px 7px;
        font-size: 10px;
      }
      .uprow {
        padding: 9px 12px 10px;
        border-bottom: 1px solid #ececec;
      }
      .uphead {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
      }
      .upname {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: #8a8a8a;
      }
      .uplvl {
        font-size: 9.5px;
        font-weight: 800;
        color: #666;
        border: 1px solid #d6d6d6;
        padding: 1px 5px;
      }
      .upnext {
        font-size: 9.5px;
        font-weight: 800;
        color: #b07714;
      }
      .upstat {
        font-size: 16px;
        font-weight: 800;
        color: #1a1a1a;
        font-variant-numeric: tabular-nums;
        margin: 1px 0 5px;
      }
      .uparrow {
        color: #b5b5b5;
        font-weight: 600;
      }
      .upbarrow {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .upbar {
        position: relative;
        flex: 1;
        height: 5px;
        background: #eaeaea;
      }
      .upfill {
        height: 100%;
        background: var(--line, #1a1a1a);
      }
      .upbar i {
        position: absolute;
        top: -2px;
        width: 2px;
        height: 9px;
        background: #b07714;
      }
      .upmax {
        font-size: 9px;
        font-weight: 700;
        color: #a5a5a5;
        white-space: nowrap;
      }
      button.buy {
        margin-left: auto;
        min-width: 76px;
        min-height: 32px;
        border: 1px solid #c9c9c9;
        background: #fff;
        color: #b0b0b0;
        font: 800 11px Inter, sans-serif;
        letter-spacing: 0.02em;
        padding: 6px 10px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      button.buy.afford {
        background: var(--line, #1a1a1a);
        border-color: var(--line, #1a1a1a);
        color: #fff;
      }
      .row.next {
        background: #f6f2e4;
      }
      #station-card .row {
        font-size: 11px;
      }
      #station-card .row .meta {
        font-size: 10px;
      }
      #panel {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(58px + env(safe-area-inset-bottom));
        max-height: 46vh;
        overflow-y: auto;
        touch-action: pan-y;
        overscroll-behavior: contain;
        padding-bottom: 4px;
        background: #ffffff;
        border: 1px solid #1a1a1a;
        z-index: 3;
        color: #1a1a1a;
      }
      .panel-head {
        position: sticky;
        top: 0;
        background: #1a1a1a;
        color: #fff;
        padding: 10px 12px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        border-top: 3px solid var(--line, #1a1a1a);
        z-index: 1;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid #ececec;
        font-size: 12px;
        letter-spacing: 0;
      }
      .row .nm {
        font-weight: 800;
        flex: 0 0 auto;
      }
      .row .meta {
        color: #666;
        flex: 1;
        font-size: 11px;
      }
      .row.locked .nm {
        color: #888;
      }
      .row button {
        background: #fff;
        border: 1px solid #1a1a1a;
        color: #1a1a1a;
        font: 800 11px Inter, sans-serif;
        letter-spacing: 0.02em;
        padding: 8px 10px;
        min-height: 32px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .row button:disabled {
        border-color: #d6d6d6;
        color: #b5b5b5;
      }
      .bullet {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        color: #fff;
        font-size: 10px;
        font-weight: 900;
        flex: 0 0 auto;
      }
      #station-card {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(58px + env(safe-area-inset-bottom));
        width: min(480px, calc(100vw - 20px));
        background: #ffffff;
        border: 1px solid #1a1a1a;
        color: #1a1a1a;
        z-index: 3;
        font-size: 12px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-bottom: 1px solid #dedede;
      }
      .card-head .xbtn {
        margin-left: auto;
        color: #1a1a1a;
      }
      .card-row {
        padding: 7px 10px;
        color: #444;
      }
      .cardgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: #dedede;
      }
      .tile {
        background: #fff;
        padding: 10px 12px;
      }
      .tile .big {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .tile .sub {
        margin-top: 2px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #8a8a8a;
        text-transform: uppercase;
      }
      .worksbtn {
        margin-left: auto;
        background: #fff;
        border: 1px solid #1a1a1a;
        color: #1a1a1a;
        font: 800 10px Inter, sans-serif;
        letter-spacing: 0.08em;
        padding: 5px 8px;
      }
      .card-head .xbtn {
        margin-left: 4px;
      }
      #toasts {
        position: fixed;
        top: calc(72px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }
      .toast {
        background: #1a1a1a;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        animation: toastfade 5.2s forwards;
      }
      @media (max-width: 560px) {
        #rate {
          display: none; /* the goal strip owns that band on phones */
        }
        .chipbtn {
          top: calc(46px + env(safe-area-inset-top));
        }
      }
      @keyframes toastfade {
        0% { opacity: 0; transform: translateY(-6px); }
        6% { opacity: 1; transform: none; }
        85% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="topbar">
      <div class="chip" id="title">METRO MAGNATE</div>
      <div class="chip" id="cash"></div>
    </div>
    <div class="chip" id="rate"></div>
    <div class="chip" id="phase"></div>
    <div id="goal-strip" class="chip"></div>
    <div id="deskbar">
      <button id="btn-lines" class="deskbtn">LINES</button>
      <button id="btn-ops" class="deskbtn">OPS</button>
      <button id="btn-goals" class="deskbtn">GOALS</button>
      <button id="btn-network" class="deskbtn">NETWORK</button>
    </div>
    <button id="btn-speed" class="chip chipbtn">⏩ 1×</button>
    <div id="panel" hidden></div>
    <div id="station-card" hidden></div>
    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

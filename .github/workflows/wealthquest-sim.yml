name: WealthQuest Sim

# Runs the automated play-agent and the UI smoke-test "on the side" — separate
# from the deploy workflow, so a test failure never blocks shipping. The
# play-agent's report prints to the log.

on:
  push:
    branches: [claude/investment-game-9xxLw]
    paths:
      - 'wealthquest/**'
      - '.github/workflows/wealthquest-sim.yml'
  workflow_dispatch:

concurrency:
  group: wealthquest-sim
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Run tests + play-agent
        working-directory: wealthquest
        run: |
          flutter --version
          flutter pub get
          flutter test --reporter expanded

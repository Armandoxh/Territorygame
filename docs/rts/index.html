<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b2a14" />
    <title>Medieval RTS</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1b2a14; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      body { font-family: system-ui, -apple-system, sans-serif; color: #f0e8d8; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }

      #top {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        left: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        justify-content: center;
        pointer-events: none;
      }
      .res {
        background: rgba(20, 16, 10, 0.78);
        border: 1px solid rgba(255, 235, 180, 0.2);
        border-radius: 8px;
        padding: 6px 10px;
        font: 600 15px/1 ui-monospace, Menlo, monospace;
        display: flex;
        align-items: baseline;
        gap: 5px;
      }
      .res small { font-size: 10px; opacity: 0.65; font-weight: 400; letter-spacing: 0.05em; }
      .res.wood { color: #e0b27a; }
      .res.gold { color: #f2c94c; }
      .res.pop { color: #bcd4f5; }

      #toast {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 50px);
        left: 50%;
        transform: translateX(-50%);
        background: rgba(120, 30, 30, 0.9);
        padding: 6px 12px;
        border-radius: 6px;
        font: 13px/1.2 system-ui, sans-serif;
        opacity: 0;
        pointer-events: none;
      }
      #toast.show { animation: toast 1.8s ease-out forwards; }
      @keyframes toast { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

      #panel {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
        max-width: 460px;
        margin: 0 auto;
        background: rgba(20, 16, 10, 0.88);
        border: 1px solid rgba(255, 235, 180, 0.22);
        border-radius: 12px;
        padding: 10px;
        box-sizing: border-box;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      }
      #panel .head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; letter-spacing: 0.03em; }
      #panel .head small { font-weight: 400; opacity: 0.65; margin-left: 6px; }
      #panel .hint { font-size: 12px; opacity: 0.7; margin: 4px 0 8px; }
      #panel .row { display: flex; gap: 8px; align-items: center; }
      #panel .queue { font: 12px ui-monospace, Menlo, monospace; opacity: 0.8; }
      #panel button {
        min-height: 44px;
        padding: 0 12px;
        background: rgba(255, 235, 180, 0.08);
        color: #f0e8d8;
        border: 1px solid rgba(255, 235, 180, 0.25);
        border-radius: 8px;
        font: 600 13px/1.1 system-ui, sans-serif;
        cursor: pointer;
        touch-action: manipulation;
      }
      #panel button:active { background: rgba(255, 235, 180, 0.2); }
      #panel button:disabled { opacity: 0.4; cursor: not-allowed; }
      #panel button.card { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 3px; flex: 1 1 0; padding: 6px 10px; }
      #panel button.card small { font-weight: 400; font-size: 11px; opacity: 0.7; }
      #panel button.poor { border-color: rgba(220, 150, 70, 0.5); }
      #panel button.poor small { color: #f0a868; opacity: 1; }
      #panel button.go { flex: 1; background: rgba(70, 130, 60, 0.9); border-color: rgba(180, 240, 170, 0.5); }
      #panel button.x { min-height: 36px; min-width: 44px; padding: 0; font-size: 16px; }
    </style>
    <script type="module" crossorigin src="/Territorygame/rts/assets/index-CFSsJFa8.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="top"></div>
    <div id="toast"></div>
    <div id="panel"></div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>swarm</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      body { font-family: system-ui, -apple-system, sans-serif; color: #ddd; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #readout {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        left: 8px;
        right: 8px;
        max-width: max-content;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        font: 12px/1.3 ui-monospace, Menlo, monospace;
        pointer-events: none;
        white-space: pre-wrap;
      }
      #newmap {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        right: 8px;
        min-height: 44px;
        padding: 0 14px;
        background: rgba(0, 0, 0, 0.6);
        color: #ddd;
        border: 1px solid #444;
        border-radius: 6px;
        font: 12px/1 ui-monospace, Menlo, monospace;
        cursor: pointer;
        touch-action: manipulation;
      }
      #newmap:active { background: rgba(60, 60, 60, 0.8); }
    </style>
    <script type="module" crossorigin src="/Territorygame/swarm/assets/index-DkPDclsr.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="readout">booting…</div>
    <button id="newmap" type="button">new map</button>
  </body>
</html>

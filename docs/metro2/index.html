<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Metro Magnate v2</title>
    <style>
      :root {
        --bg: #0b1019;
        --card: #10192a;
        --card2: #141f33;
        --edge: #223049;
        --txt: #e9edf4;
        --dim: #8b95a7;
        --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation; /* kills iOS double-tap page zoom */
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      /* ── The header block: one composed card, not floating chips ── */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2;
        background: var(--card);
        border-bottom: 1px solid var(--edge);
        padding: calc(8px + env(safe-area-inset-top)) 16px 0;
      }
      .hudrow {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #hud-city {
        color: var(--dim);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        flex: 1;
      }
      #btn-speed,
      #btn-mute {
        background: var(--card2);
        border: 1px solid var(--edge);
        color: var(--txt);
        font: 800 12px Inter, sans-serif;
        padding: 6px 12px;
        min-height: 32px;
      }
      #btn-mute {
        flex: 0 0 auto;
        padding: 6px 9px;
      }

      /* ── THE WIRE: one-line city news under the header ── */
      #ticker {
        border-top: 1px solid var(--edge);
        padding: 6px 0 8px;
        font: 700 10px var(--mono);
        letter-spacing: 0.04em;
        color: #c9a35c;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-height: 13px;
      }
      #ticker.flash {
        animation: wirein 0.45s ease-out;
      }
      @keyframes wirein {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }

      /* ── Purchase juice ── */
      .flyout {
        position: fixed;
        transform: translateX(-50%);
        font: 800 13px var(--mono);
        color: #ff8d86;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        pointer-events: none;
        z-index: 9;
        animation: flyup 0.85s ease-out forwards;
      }
      @keyframes flyup {
        from { opacity: 1; }
        to { opacity: 0; transform: translateX(-50%) translateY(-34px); }
      }
      .uprow.pulse,
      .row.pulse {
        animation: rowpulse 0.5s ease-out;
      }
      @keyframes rowpulse {
        from { background: rgba(255, 255, 255, 0.12); }
        to { background: transparent; }
      }
      .pulse .pips i.on {
        animation: pipglow 0.55s ease-out;
      }
      @keyframes pipglow {
        from { filter: brightness(2.4); }
        to { filter: none; }
      }

      /* ── Commendation splash: stop the screen for a beat ── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 15;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 9, 17, 0.55);
        pointer-events: none;
      }
      #splash[hidden] {
        display: none;
      }
      #splash .sp-in {
        text-align: center;
        transform: scale(0.8);
        opacity: 0;
      }
      #splash.go .sp-in {
        animation: spin2 1.4s ease-out forwards;
      }
      @keyframes spin2 {
        0% { transform: scale(0.8); opacity: 0; }
        14% { transform: scale(1.04); opacity: 1; }
        22% { transform: scale(1); }
        78% { opacity: 1; }
        100% { opacity: 0; }
      }
      .sp-k {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.3em;
        color: #f0b429;
      }
      .sp-t {
        font-size: 30px;
        font-weight: 800;
        color: #fff;
        margin: 6px 0 4px;
        text-shadow: 0 2px 18px rgba(240, 180, 41, 0.35);
      }
      .sp-s {
        font: 700 13px var(--mono);
        color: #cfd6e2;
      }

      /* ── Golden contracts ── */
      .row.golden {
        background: rgba(240, 180, 41, 0.08);
        box-shadow: inset 3px 0 0 #f0b429;
      }
      .row.golden .nm {
        color: #f0b429;
      }
      .goldpay {
        color: #f0b429 !important;
      }
      button.goldbtn {
        background: #f0b429 !important;
        border-color: #f0b429 !important;
        color: #231a02 !important;
      }
      .card-row.urgent {
        color: #ff6b62;
        font-weight: 800;
        animation: urgentpulse 1s infinite;
      }
      @keyframes urgentpulse {
        50% { opacity: 0.55; }
      }

      /* ── The superintendent ── */
      .row.supt .sicon {
        font-size: 15px;
        color: var(--dim);
      }
      .row.supt.on {
        background: rgba(87, 199, 133, 0.06);
      }
      .row.supt.on .sicon {
        color: #57c785;
        animation: gearspin 6s linear infinite;
      }
      .row.supt.on .nm {
        color: #57c785;
      }
      @keyframes gearspin {
        to { transform: rotate(360deg); }
      }
      .sicon.small {
        font-size: 12px;
        color: #57c785;
      }

      /* ── Relief dispatch ── */
      .reliefrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px 12px;
        border-top: 1px solid var(--edge);
      }
      .reliefbtn {
        background: #b93c5d;
        border: none;
        color: #fff;
        font: 800 11.5px Inter, sans-serif;
        letter-spacing: 0.05em;
        padding: 11px 14px;
        min-height: 40px;
        animation: reliefglow 1.6s infinite;
      }
      @keyframes reliefglow {
        50% { box-shadow: 0 0 14px rgba(224, 58, 47, 0.55); }
      }
      .reliefnote {
        color: var(--dim);
        font-size: 10px;
        flex: 1;
      }
      .flyout.gain {
        color: #57c785;
      }

      /* ── The return card: the day-30 front door ── */
      #return-card {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(5, 9, 17, 0.86);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* display:flex would otherwise beat the UA's [hidden] rule and a
       * dismissed card would keep eating every tap. */
      #return-card[hidden] {
        display: none;
      }
      .rc-inner {
        background: var(--card);
        border: 1px solid var(--edge);
        border-top: 3px solid #57c785;
        padding: 28px 30px 24px;
        text-align: center;
        min-width: 270px;
      }
      .rc-kicker {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        color: var(--dim);
      }
      .rc-time {
        font: 700 11px var(--mono);
        color: var(--dim);
        margin-top: 4px;
      }
      .rc-big {
        font-size: 42px;
        font-weight: 800;
        color: #57c785;
        font-variant-numeric: tabular-nums;
        margin: 14px 0 4px;
      }
      .rc-sub {
        font: 700 12px var(--mono);
        color: var(--txt);
        margin-bottom: 20px;
      }
      #rc-collect {
        background: #57c785;
        border: none;
        color: #06220f;
        font: 800 14px Inter, sans-serif;
        letter-spacing: 0.1em;
        padding: 13px 44px;
        min-height: 44px;
        cursor: pointer;
      }
      #cash {
        color: var(--txt);
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.01em;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      .cashrate {
        display: block;
        color: #57c785;
        font: 700 12px var(--mono);
        margin: 1px 0 7px;
      }
      #goal-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 0 10px;
        border-top: 1px solid var(--edge);
        cursor: pointer;
      }
      .gslabel {
        color: var(--txt);
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.1em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gslabel b {
        color: var(--dim);
        font-weight: 800;
      }
      .gsbar {
        flex: 1;
        height: 4px;
        background: var(--edge);
        min-width: 40px;
      }
      .gsfill {
        display: block;
        height: 100%;
      }
      .gspct {
        color: var(--dim);
        font: 700 10px var(--mono);
      }
      #rate {
        display: none;
      }

      /* ── Bottom nav: icons + labels, one bar ── */
      #deskbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 3;
        display: flex;
        background: var(--card);
        border-top: 1px solid var(--edge);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .deskbtn {
        position: relative;
        flex: 1;
        background: none;
        border: none;
        color: var(--dim);
        font: 800 10px Inter, sans-serif;
        letter-spacing: 0.1em;
        padding: 9px 0 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .deskbtn i {
        font-style: normal;
        font-size: 16px;
        line-height: 1;
      }
      .deskbtn.on {
        color: var(--txt);
      }
      .deskbtn.on::before {
        content: '';
        position: absolute;
        top: 0;
        left: 25%;
        right: 25%;
        height: 3px;
        background: #e5484d;
      }
      .deskbtn.dot::after {
        content: '';
        position: absolute;
        top: 6px;
        right: 26%;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f08c3a;
      }
      #phase {
        flex: 0 0 74px;
        border-left: 1px solid var(--edge);
        color: #ffd98a;
        font-weight: 800;
      }

      /* ── Panels: dark cards over the light map ── */
      #panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(56px + env(safe-area-inset-bottom));
        max-height: 56vh;
        overflow-y: auto;
        touch-action: pan-y;
        overscroll-behavior: contain;
        padding-bottom: 22px;
        background: var(--card);
        border-top: 3px solid var(--line, #e5484d);
        z-index: 3;
        color: var(--txt);
      }
      .panel-head {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        background: var(--card);
        color: var(--txt);
        padding: 12px 16px 10px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        z-index: 1;
      }
      .panel-head > span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .head-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }
      .xbtn {
        background: none;
        border: none;
        color: var(--dim);
        font-size: 20px;
        line-height: 1;
        padding: 8px 12px;
        margin: -8px -10px -8px 0;
        cursor: pointer;
      }
      .sect {
        background: none;
        padding: 10px 16px 4px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .sect .sq {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 7px;
        vertical-align: 1px;
      }
      .sect .cnt {
        float: right;
        color: var(--dim);
        font: 700 10px var(--mono);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-bottom: 1px solid var(--edge);
        font-size: 12px;
        color: var(--txt);
      }
      .row .nm {
        font-weight: 800;
        flex: 0 0 auto;
      }
      .row .meta {
        color: var(--dim);
        flex: 1;
        font-size: 11px;
      }
      .row.locked .nm {
        color: var(--dim);
      }
      .row .chev {
        color: var(--dim);
        font-size: 16px;
        font-weight: 800;
      }
      .row button,
      .card-head button:not(.xbtn) {
        background: var(--card2);
        border: 1px solid var(--edge);
        color: var(--txt);
        font: 800 11px Inter, sans-serif;
        padding: 8px 10px;
        min-height: 32px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .row button:disabled {
        color: #4d5a72;
        border-color: #1b2739;
        background: none;
      }
      .row .pri {
        padding: 4px 8px;
        font-size: 10px;
        min-height: 26px;
      }
      .row.next {
        background: rgba(255, 255, 255, 0.03);
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--edge);
      }
      .tabs button {
        flex: 1;
        background: none;
        border: none;
        color: #aeb8ca;
        font: 800 10.5px Inter, sans-serif;
        letter-spacing: 0.1em;
        padding: 12px 6px;
      }
      .tabs button:first-child {
        flex: 0 0 52px;
        font-size: 16px;
        color: var(--txt);
      }
      .tabs button.on {
        color: var(--txt);
        box-shadow: inset 0 -3px 0 var(--line, #e5484d);
      }

      /* ── THE UpgradeRow (b59): one component, every shop.
         Affordable = lit spine + filled price; otherwise the whole
         row falls back. Pip track gives scale even at L0. ── */
      .segrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px 10px;
        border-bottom: 1px solid var(--edge);
      }
      .seg3 {
        display: flex;
        border: 1px solid var(--edge);
      }
      .seg3 .seg {
        background: none;
        border: none;
        color: #aeb8ca;
        font: 800 11px Inter, sans-serif;
        padding: 7px 14px;
        min-height: 32px;
      }
      .seg3 .seg + .seg {
        border-left: 1px solid var(--edge);
      }
      .seg3 .seg.on {
        background: var(--card2);
        color: var(--txt);
        box-shadow: inset 0 -2px 0 var(--line, #e5484d);
      }
      .segnote {
        margin-left: auto;
        font: 700 10px var(--mono);
        color: var(--dim);
      }
      .uprow {
        padding: 10px 16px 11px 13px;
        border-bottom: 1px solid var(--edge);
        border-left: 3px solid transparent;
      }
      .uprow.ok {
        border-left-color: var(--cat, var(--line, #e5484d));
      }
      .uprow.no .upname,
      .uprow.no .upsub,
      .uprow.no .uplvl,
      .uprow.no .pips i.on {
        opacity: 0.55;
      }
      .uprow.maxed {
        border-left-color: var(--cat, var(--line, #e5484d));
        opacity: 0.72;
      }
      .uphead {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 34px;
      }
      .upname {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--txt);
      }
      .uplvl {
        font: 800 9.5px var(--mono);
        color: var(--dim);
        border: 1px solid var(--edge);
        padding: 1px 5px;
      }
      .upnext {
        font-size: 9.5px;
        font-weight: 800;
        color: #f0b429;
      }
      .upsub {
        font: 700 11px var(--mono);
        color: #97a1b4;
        margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }
      .upsub b {
        color: var(--txt);
        font-weight: 800;
      }
      .pips {
        position: relative;
        display: flex;
        gap: 3px;
        height: 5px;
        margin-top: 8px;
      }
      .pips i {
        flex: 1;
        background: var(--edge);
      }
      .pips i.on {
        background: var(--cat, var(--line, #e5484d));
      }
      .pips em {
        position: absolute;
        top: -2px;
        width: 2px;
        height: 9px;
        background: #f0b429;
      }
      .pricecol {
        margin-left: auto;
        flex: 0 0 88px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
      }
      .pricecol button.buy {
        width: 100%;
        min-width: 0;
      }
      .modecnt {
        font: 700 9px var(--mono);
        color: var(--dim);
        text-align: center;
        letter-spacing: 0.06em;
      }
      .uphead .pri {
        flex: 0 0 auto;
        background: none;
        border: 1px solid var(--edge);
        color: #55627a;
        font-size: 10px;
        padding: 4px 8px;
        min-height: 26px;
      }
      .uphead .pri.lit {
        color: #f0b429;
        border-color: #f0b429;
      }
      button.buy {
        min-width: 88px;
        min-height: 32px;
        border: 1px solid var(--edge);
        background: none;
        color: #4d5a72;
        font: 800 11px Inter, sans-serif;
        padding: 6px 8px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      button.buy.afford {
        background: var(--cat, var(--line, #e5484d));
        border-color: var(--cat, var(--line, #e5484d));
        color: #fff;
      }

      /* ── Goals: fill-cards per the mock ── */
      .multrow {
        display: flex;
        gap: 6px;
        padding: 0 16px 10px;
        flex-wrap: wrap;
      }
      .multchip {
        font: 700 10.5px var(--mono);
        padding: 4px 8px;
        background: var(--card2);
        color: var(--dim);
      }
      .multchip.lit {
        background: rgba(87, 199, 133, 0.16);
      }
      .sq {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 7px;
        vertical-align: 0;
      }
      .gcard {
        position: relative;
        margin: 4px 16px 6px;
        background: var(--card2);
        overflow: hidden;
        padding: 11px 12px;
      }
      .gcard .gfill2 {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--tk, #57c785);
        opacity: 0.22;
      }
      .gtitle {
        position: relative;
        font-size: 14px;
        font-weight: 800;
        color: var(--txt);
      }
      .gsub {
        position: relative;
        font: 700 11px var(--mono);
        color: var(--dim);
        margin-top: 3px;
      }
      .gr {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        font: 700 11.5px var(--mono);
      }
      .gcard.moveon {
        border: 1px solid #f0b429;
        cursor: pointer;
        margin-top: 10px;
      }
      .gcard.moveon .gtitle {
        color: #f0b429;
        letter-spacing: 0.06em;
      }
      .gcard.moveon.armed {
        border-color: #e5484d;
        background: #1c1220;
      }
      .gcard.moveon.armed .gtitle {
        color: #ff6b62;
      }
      .gnext.ladder {
        padding: 8px 18px 10px;
        color: #7f8aa0;
      }
      .gnext {
        padding: 0 18px 10px;
        font-size: 11px;
        font-weight: 700;
        color: var(--dim);
        display: flex;
        gap: 8px;
      }
      .gnext .gr2 {
        margin-left: auto;
        font: 700 10.5px var(--mono);
      }
      .buildfoot {
        padding: 12px;
        text-align: center;
        font: 700 9px var(--mono);
        letter-spacing: 0.1em;
        color: #44506a;
      }
      .pbar {
        height: 5px;
        background: var(--edge);
        margin: 0 16px 10px;
      }
      .pfill {
        height: 100%;
        background: var(--txt);
      }
      .rushnow {
        color: #ff6b62;
        font-weight: 800;
      }
      .card-row {
        padding: 8px 16px;
        color: var(--dim);
        font-size: 12px;
      }

      /* ── Station card ── */
      #station-card {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(52px + env(safe-area-inset-bottom));
        background: var(--card);
        border-top: 3px solid var(--line, #e5484d);
        color: var(--txt);
        z-index: 3;
        font-size: 12px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px 10px;
        font-size: 14px;
      }
      .card-head .xbtn {
        margin-left: 4px;
      }
      .worksbtn {
        margin-left: auto;
      }
      .cardgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--edge);
        border-top: 1px solid var(--edge);
      }
      .tile {
        background: var(--card);
        padding: 11px 16px;
      }
      .tile .big {
        font-size: 20px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .tile .sub {
        margin-top: 2px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--dim);
        text-transform: uppercase;
      }
      .bullet {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 19px;
        height: 19px;
        border-radius: 50%;
        color: #fff;
        font-size: 10px;

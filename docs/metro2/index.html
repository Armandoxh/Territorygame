<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Metro Magnate v2</title>
    <style>
      :root {
        --bg: #0b1019;
        --card: #10192a;
        --card2: #141f33;
        --edge: #223049;
        --txt: #e9edf4;
        --dim: #8b95a7;
        --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation; /* kills iOS double-tap page zoom */
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      /* ── The header block: one composed card, not floating chips ── */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2;
        background: var(--card);
        border-bottom: 1px solid var(--edge);
        padding: calc(8px + env(safe-area-inset-top)) 16px 0;
      }
      .hudrow {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #hud-city {
        color: var(--dim);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        flex: 1;
      }
      #btn-speed {
        background: var(--card2);
        border: 1px solid var(--edge);
        color: var(--txt);
        font: 800 12px Inter, sans-serif;
        padding: 6px 12px;
        min-height: 32px;
      }
      #cash {
        color: var(--txt);
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.01em;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      .cashrate {
        display: block;
        color: #57c785;
        font: 700 12px var(--mono);
        margin: 1px 0 7px;
      }
      #goal-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 0 10px;
        border-top: 1px solid var(--edge);
        cursor: pointer;
      }
      .gslabel {
        color: var(--txt);
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.1em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gslabel b {
        color: var(--dim);
        font-weight: 800;
      }
      .gsbar {
        flex: 1;
        height: 4px;
        background: var(--edge);
        min-width: 40px;
      }
      .gsfill {
        display: block;
        height: 100%;
      }
      .gspct {
        color: var(--dim);
        font: 700 10px var(--mono);
      }
      #rate {
        display: none;
      }

      /* ── Bottom nav: icons + labels, one bar ── */
      #deskbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 3;
        display: flex;
        background: var(--card);
        border-top: 1px solid var(--edge);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .deskbtn {
        position: relative;
        flex: 1;
        background: none;
        border: none;
        color: var(--dim);
        font: 800 10px Inter, sans-serif;
        letter-spacing: 0.1em;
        padding: 9px 0 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .deskbtn i {
        font-style: normal;
        font-size: 16px;
        line-height: 1;
      }
      .deskbtn.on {
        color: var(--txt);
      }
      .deskbtn.on::before {
        content: '';
        position: absolute;
        top: 0;
        left: 25%;
        right: 25%;
        height: 3px;
        background: #e5484d;
      }
      .deskbtn.dot::after {
        content: '';
        position: absolute;
        top: 6px;
        right: 26%;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f08c3a;
      }
      #phase {
        flex: 0 0 74px;
        border-left: 1px solid var(--edge);
        color: #ffd98a;
        font-weight: 800;
      }

      /* ── Panels: dark cards over the light map ── */
      #panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(56px + env(safe-area-inset-bottom));
        max-height: 56vh;
        overflow-y: auto;
        touch-action: pan-y;
        overscroll-behavior: contain;
        padding-bottom: 22px;
        background: var(--card);
        border-top: 3px solid var(--line, #e5484d);
        z-index: 3;
        color: var(--txt);
      }
      .panel-head {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        background: var(--card);
        color: var(--txt);
        padding: 12px 16px 10px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        z-index: 1;
      }
      .panel-head > span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .head-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
      }
      .xbtn {
        background: none;
        border: none;
        color: var(--dim);
        font-size: 20px;
        line-height: 1;
        padding: 8px 12px;
        margin: -8px -10px -8px 0;
        cursor: pointer;
      }
      .sect {
        background: none;
        padding: 10px 16px 4px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .sect .sq {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 7px;
        vertical-align: 1px;
      }
      .sect .cnt {
        float: right;
        color: var(--dim);
        font: 700 10px var(--mono);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-bottom: 1px solid var(--edge);
        font-size: 12px;
        color: var(--txt);
      }
      .row .nm {
        font-weight: 800;
        flex: 0 0 auto;
      }
      .row .meta {
        color: var(--dim);
        flex: 1;
        font-size: 11px;
      }
      .row.locked .nm {
        color: var(--dim);
      }
      .row .chev {
        color: var(--dim);
        font-size: 16px;
        font-weight: 800;
      }
      .row button,
      .card-head button:not(.xbtn) {
        background: var(--card2);
        border: 1px solid var(--edge);
        color: var(--txt);
        font: 800 11px Inter, sans-serif;
        padding: 8px 10px;
        min-height: 32px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .row button:disabled {
        color: #4d5a72;
        border-color: #1b2739;
        background: none;
      }
      .row .pri {
        padding: 4px 8px;
        font-size: 10px;
        min-height: 26px;
      }
      .row.next {
        background: rgba(255, 255, 255, 0.03);
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--edge);
      }
      .tabs button {
        flex: 1;
        background: none;
        border: none;
        color: #aeb8ca;
        font: 800 10.5px Inter, sans-serif;
        letter-spacing: 0.1em;
        padding: 12px 6px;
      }
      .tabs button:first-child {
        flex: 0 0 52px;
        font-size: 16px;
        color: var(--txt);
      }
      .tabs button.on {
        color: var(--txt);
        box-shadow: inset 0 -3px 0 var(--line, #e5484d);
      }

      /* ── THE UpgradeRow (b59): one component, every shop.
         Affordable = lit spine + filled price; otherwise the whole
         row falls back. Pip track gives scale even at L0. ── */
      .segrow {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px 10px;
        border-bottom: 1px solid var(--edge);
      }
      .seg3 {
        display: flex;
        border: 1px solid var(--edge);
      }
      .seg3 .seg {
        background: none;
        border: none;
        color: #aeb8ca;
        font: 800 11px Inter, sans-serif;
        padding: 7px 14px;
        min-height: 32px;
      }
      .seg3 .seg + .seg {
        border-left: 1px solid var(--edge);
      }
      .seg3 .seg.on {
        background: var(--card2);
        color: var(--txt);
        box-shadow: inset 0 -2px 0 var(--line, #e5484d);
      }
      .segnote {
        margin-left: auto;
        font: 700 10px var(--mono);
        color: var(--dim);
      }
      .uprow {
        padding: 10px 16px 11px 13px;
        border-bottom: 1px solid var(--edge);
        border-left: 3px solid transparent;
      }
      .uprow.ok {
        border-left-color: var(--cat, var(--line, #e5484d));
      }
      .uprow.no .upname,
      .uprow.no .upsub,
      .uprow.no .uplvl,
      .uprow.no .pips i.on {
        opacity: 0.55;
      }
      .uprow.maxed {
        border-left-color: var(--cat, var(--line, #e5484d));
        opacity: 0.72;
      }
      .uphead {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 34px;
      }
      .upname {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--txt);
      }
      .uplvl {
        font: 800 9.5px var(--mono);
        color: var(--dim);
        border: 1px solid var(--edge);
        padding: 1px 5px;
      }
      .upnext {
        font-size: 9.5px;
        font-weight: 800;
        color: #f0b429;
      }
      .upsub {
        font: 700 11px var(--mono);
        color: #97a1b4;
        margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }
      .upsub b {
        color: var(--txt);
        font-weight: 800;
      }
      .pips {
        position: relative;
        display: flex;
        gap: 3px;
        height: 5px;
        margin-top: 8px;
      }
      .pips i {
        flex: 1;
        background: var(--edge);
      }
      .pips i.on {
        background: var(--cat, var(--line, #e5484d));
      }
      .pips em {
        position: absolute;
        top: -2px;
        width: 2px;
        height: 9px;
        background: #f0b429;
      }
      .pricecol {
        margin-left: auto;
        flex: 0 0 88px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
      }
      .pricecol button.buy {
        width: 100%;
        min-width: 0;
      }
      .modecnt {
        font: 700 9px var(--mono);
        color: var(--dim);
        text-align: center;
        letter-spacing: 0.06em;
      }
      .uphead .pri {
        flex: 0 0 auto;
        background: none;
        border: 1px solid var(--edge);
        color: #55627a;
        font-size: 10px;
        padding: 4px 8px;
        min-height: 26px;
      }
      .uphead .pri.lit {
        color: #f0b429;
        border-color: #f0b429;
      }
      button.buy {
        min-width: 88px;
        min-height: 32px;
        border: 1px solid var(--edge);
        background: none;
        color: #4d5a72;
        font: 800 11px Inter, sans-serif;
        padding: 6px 8px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      button.buy.afford {
        background: var(--cat, var(--line, #e5484d));
        border-color: var(--cat, var(--line, #e5484d));
        color: #fff;
      }

      /* ── Goals: fill-cards per the mock ── */
      .multrow {
        display: flex;
        gap: 6px;
        padding: 0 16px 10px;
        flex-wrap: wrap;
      }
      .multchip {
        font: 700 10.5px var(--mono);
        padding: 4px 8px;
        background: var(--card2);
        color: var(--dim);
      }
      .multchip.lit {
        background: rgba(87, 199, 133, 0.16);
      }
      .sq {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 7px;
        vertical-align: 0;
      }
      .gcard {
        position: relative;
        margin: 4px 16px 6px;
        background: var(--card2);
        overflow: hidden;
        padding: 11px 12px;
      }
      .gcard .gfill2 {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--tk, #57c785);
        opacity: 0.22;
      }
      .gtitle {
        position: relative;
        font-size: 14px;
        font-weight: 800;
        color: var(--txt);
      }
      .gsub {
        position: relative;
        font: 700 11px var(--mono);
        color: var(--dim);
        margin-top: 3px;
      }
      .gr {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        font: 700 11.5px var(--mono);
      }
      .gcard.moveon {
        border: 1px solid #f0b429;
        cursor: pointer;
        margin-top: 10px;
      }
      .gcard.moveon .gtitle {
        color: #f0b429;
        letter-spacing: 0.06em;
      }
      .gcard.moveon.armed {
        border-color: #e5484d;
        background: #1c1220;
      }
      .gcard.moveon.armed .gtitle {
        color: #ff6b62;
      }
      .gnext.ladder {
        padding: 8px 18px 10px;
        color: #7f8aa0;
      }
      .gnext {
        padding: 0 18px 10px;
        font-size: 11px;
        font-weight: 700;
        color: var(--dim);
        display: flex;
        gap: 8px;
      }
      .gnext .gr2 {
        margin-left: auto;
        font: 700 10.5px var(--mono);
      }
      .buildfoot {
        padding: 12px;
        text-align: center;
        font: 700 9px var(--mono);
        letter-spacing: 0.1em;
        color: #44506a;
      }
      .pbar {
        height: 5px;
        background: var(--edge);
        margin: 0 16px 10px;
      }
      .pfill {
        height: 100%;
        background: var(--txt);
      }
      .rushnow {
        color: #ff6b62;
        font-weight: 800;
      }
      .card-row {
        padding: 8px 16px;
        color: var(--dim);
        font-size: 12px;
      }

      /* ── Station card ── */
      #station-card {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(52px + env(safe-area-inset-bottom));
        background: var(--card);
        border-top: 3px solid var(--line, #e5484d);
        color: var(--txt);
        z-index: 3;
        font-size: 12px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px 10px;
        font-size: 14px;
      }
      .card-head .xbtn {
        margin-left: 4px;
      }
      .worksbtn {
        margin-left: auto;
      }
      .cardgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--edge);
        border-top: 1px solid var(--edge);
      }
      .tile {
        background: var(--card);
        padding: 11px 16px;
      }
      .tile .big {
        font-size: 20px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .tile .sub {
        margin-top: 2px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--dim);
        text-transform: uppercase;
      }
      .bullet {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 19px;
        height: 19px;
        border-radius: 50%;
        color: #fff;
        font-size: 10px;
        font-weight: 900;
        flex: 0 0 auto;
      }

      /* ── Toasts ── */
      #toasts {
        position: fixed;
        top: calc(118px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
        width: max-content;
        max-width: 92vw;
      }
      .toast {
        background: var(--card2);
        color: var(--txt);
        border: 1px solid var(--edge);
        padding: 9px 13px;
        font-size: 11px;
        font-weight: 700;
        animation: toastfade 5.2s forwards;
      }
      @keyframes toastfade {
        0% { opacity: 0; transform: translateY(-6px); }
        6% { opacity: 1; transform: none; }
        85% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
    <script type="module" crossorigin src="/Territorygame/metro2/assets/index-3-CY91QJ.js"></script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <div class="hudrow">
        <span id="hud-city">NEW MERIDIAN</span>
        <button id="btn-speed">⏩ 1×</button>
      </div>
      <div id="cash"></div>
      <div id="goal-strip"></div>
    </div>
    <div id="rate"></div>
    <div id="deskbar">
      <button id="btn-lines" class="deskbtn"><i>▤</i>LINES</button>
      <button id="btn-ops" class="deskbtn"><i>◈</i>OPS</button>
      <button id="btn-goals" class="deskbtn"><i>◎</i>GOALS</button>
      <button id="btn-network" class="deskbtn"><i>⬡</i>NET</button>
      <div id="phase" class="deskbtn"></div>
    </div>
    <div id="panel" hidden></div>
    <div id="station-card" hidden></div>
    <div id="toasts"></div>
  </body>
</html>
